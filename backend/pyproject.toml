[project]
name = "revana-backend"
version = "0.1.0"
description = "Revana API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic-settings>=2.6",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
