  <text x="1116" y="263" class="serif" fill="#252725" font-size="24">Trusted data</text>
  <rect x="1116" y="310" width="200" height="122" rx="14" fill="#233C34"/>
  <text x="1138" y="342" class="sans" fill="#C4D1C7" font-size="10" font-weight="700" letter-spacing="1.3">AUTH · GOOGLE FIRST</text>
  <text x="1138" y="372" class="sans" fill="#FFFFFF" font-size="14" font-weight="700">Supabase Auth</text>
  <text x="1138" y="396" class="sans" fill="#D4DED6" font-size="11">Apple when planned</text>
  <text x="1138" y="416" class="sans" fill="#D4DED6" font-size="11">Verified JWT identity</text>
  <rect x="1116" y="452" width="200" height="143" rx="14" fill="#F4F2EC" stroke="#E4E0D8"/>
  <text x="1138" y="484" class="sans" fill="#53705F" font-size="10" font-weight="700" letter-spacing="1.3">DATA STORE</text>
  <text x="1138" y="516" class="serif" fill="#252725" font-size="22">PostgreSQL</text>
  <text x="1138" y="545" class="sans" fill="#706F69" font-size="11">profiles · plans</text>
  <text x="1138" y="565" class="sans" fill="#706F69" font-size="11">activity · messages</text>
  <text x="1138" y="585" class="sans" fill="#706F69" font-size="11">evidence · audit history</text>
  <rect x="1116" y="616" width="200" height="114" rx="14" fill="#F8F6F1" stroke="#E4E0D8"/>
  <text x="1138" y="649" class="sans" fill="#B96F57" font-size="10" font-weight="700" letter-spacing="1.3">GOVERNANCE</text>
  <text x="1138" y="677" class="sans" fill="#252725" font-size="12" font-weight="700">Consent · export</text>
  <text x="1138" y="699" class="sans" fill="#252725" font-size="12" font-weight="700">Deletion · retention</text>
  <path d="M998 463H1074" stroke="#7A8E80" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1075 485H1002" stroke="#A58A79" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="96" y="804" width="1248" height="126" rx="20" fill="#FFFDF8" stroke="#DDD8CE"/>
  <text x="126" y="841" class="sans" fill="#B96F57" font-size="11" font-weight="700" letter-spacing="1.6">KEEP THESE RECORDS DISTINCT</text>
  <rect x="126" y="862" width="276" height="43" rx="12" fill="#F2E4DF"/>
  <text x="147" y="889" class="sans" fill="#7A4E40" font-size="13" font-weight="700">USER-REPORTED INPUT</text>
  <text x="418" y="889" class="sans" fill="#706F69" font-size="19">≠</text>
  <rect x="448" y="862" width="246" height="43" rx="12" fill="#E4EDE3"/>
  <text x="468" y="889" class="sans" fill="#3F5F49" font-size="13" font-weight="700">PLANNED ACTION</text>
  <text x="710" y="889" class="sans" fill="#706F69" font-size="19">≠</text>
  <rect x="740" y="862" width="277" height="43" rx="12" fill="#E7E4ED"/>
  <text x="761" y="889" class="sans" fill="#655A7B" font-size="13" font-weight="700">REPORTED ACTIVITY</text>
  <text x="1044" y="879" class="sans" fill="#706F69" font-size="12">Every record has owner,</text>
  <text x="1044" y="898" class="sans" fill="#706F69" font-size="12">source, and timestamp.</text>
