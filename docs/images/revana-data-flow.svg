  <rect width="1440" height="1000" fill="url(#bg)"/>
  <circle cx="1290" cy="110" r="180" fill="#D9E4D8" opacity=".6"/>
  <text x="100" y="76" class="sans" fill="#53705F" font-size="14" font-weight="700" letter-spacing="3">REVANA · DATA &amp; SERVICE CONCEPT</text>
  <text x="100" y="128" class="serif" fill="#252725" font-size="38">Collect with care. Recommend with evidence.</text>
  <text x="100" y="161" class="sans" fill="#706F69" font-size="15">Two projects, a documented API, and a clear boundary between user reports and generated plans.</text>
  <rect x="96" y="204" width="360" height="565" rx="22" fill="#FFFEFB" stroke="#DDD8CE"/>
  <rect x="96" y="204" width="360" height="75" rx="22" fill="#E8EDE5"/>
  <path d="M96 257V279H456V257" fill="#E8EDE5"/>
  <text x="126" y="239" class="sans" fill="#53705F" font-size="11" font-weight="700" letter-spacing="1.8">PROJECT 01 · THIS REPOSITORY</text>
  <text x="126" y="263" class="serif" fill="#252725" font-size="24">Revana Frontend</text>
  <rect x="126" y="310" width="300" height="88" rx="14" fill="#F8F6F1" stroke="#E4E0D8"/>
  <circle cx="154" cy="340" r="12" fill="#E2EBE1"/>
  <path d="M149 340h10m-5-5v10" stroke="#53705F" stroke-width="1.5" stroke-linecap="round"/>
  <text x="178" y="343" class="sans" fill="#252725" font-size="14" font-weight="700">Profile &amp; check-ins</text>
  <text x="148" y="373" class="sans" fill="#706F69" font-size="12">Goals, routines, notes, action reports</text>
  <rect x="126" y="417" width="300" height="88" rx="14" fill="#F8F6F1" stroke="#E4E0D8"/>
  <circle cx="154" cy="447" r="12" fill="#F2E4DF"/>
  <path d="m149 447 4 4 7-8" stroke="#B96F57" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="178" y="450" class="sans" fill="#252725" font-size="14" font-weight="700">Review &amp; control</text>
  <text x="148" y="480" class="sans" fill="#706F69" font-size="12">Why suggested, edit, skip, delete</text>
  <rect x="126" y="530" width="300" height="91" rx="14" fill="#233C34"/>
  <text x="148" y="559" class="sans" fill="#C4D1C7" font-size="10" font-weight="700" letter-spacing="1.4">DOCUMENTED HTTP API</text>
  <text x="148" y="588" class="sans" fill="#FFFFFF" font-size="14" font-weight="700">OpenAPI · /v1/...</text>
  <text x="148" y="608" class="sans" fill="#C4D1C7" font-size="11">No database or model keys in browser</text>
  <rect x="126" y="646" width="300" height="84" rx="14" fill="#F4F2EC"/>
  <text x="148" y="675" class="sans" fill="#53705F" font-size="10" font-weight="700" letter-spacing="1.4">IDENTITY</text>
  <text x="148" y="701" class="sans" fill="#252725" font-size="13">Google first · Apple later</text>
  <text x="148" y="719" class="sans" fill="#706F69" font-size="11">Backend validates signed identity tokens</text>
  <rect x="548" y="204" width="450" height="565" rx="22" fill="#FFFEFB" stroke="#DDD8CE"/>
  <rect x="548" y="204" width="450" height="75" rx="22" fill="#E7E4ED"/>
  <path d="M548 257V279H998V257" fill="#E7E4ED"/>
  <text x="578" y="239" class="sans" fill="#71658A" font-size="11" font-weight="700" letter-spacing="1.8">PROJECT 02 · SEPARATE REPOSITORY</text>
  <text x="578" y="263" class="serif" fill="#252725" font-size="24">Revana Backend</text>
  <rect x="578" y="310" width="390" height="83" rx="14" fill="#F8F6F1" stroke="#E4E0D8"/>
  <text x="601" y="341" class="sans" fill="#252725" font-size="14" font-weight="700">FastAPI · Python · Pydantic</text>
  <text x="601" y="369" class="sans" fill="#706F69" font-size="12">Authentication · ownership · validation · safety</text>
  <rect x="578" y="412" width="390" height="96" rx="14" fill="#F8F6F1" stroke="#E4E0D8"/>
  <text x="601" y="443" class="sans" fill="#252725" font-size="14" font-weight="700">Recommendation service</text>
  <text x="601" y="468" class="sans" fill="#706F69" font-size="12">Curated evidence → constrained draft → checks</text>
  <text x="601" y="490" class="sans" fill="#53705F" font-size="11" font-weight="700">Traceable sources · validated output · safe fallback</text>
  <rect x="578" y="527" width="390" height="94" rx="14" fill="#F8F6F1" stroke="#E4E0D8"/>
  <text x="601" y="558" class="sans" fill="#252725" font-size="14" font-weight="700">LLM provider adapter · backend only</text>
  <text x="601" y="584" class="sans" fill="#706F69" font-size="12">No diagnosis · no fabricated citations · no secrets in UI</text>
  <rect x="578" y="641" width="390" height="89" rx="14" fill="#F4F2EC"/>
  <text x="601" y="671" class="sans" fill="#53705F" font-size="10" font-weight="700" letter-spacing="1.4">PERSISTENCE LAYER</text>
  <text x="601" y="700" class="sans" fill="#252725" font-size="14" font-weight="700">SQLAlchemy 2 · Alembic migrations</text>
  <path d="M456 573H534" stroke="#7A8E80" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M535 590H460" stroke="#A58A79" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1088" y="204" width="256" height="565" rx="22" fill="#FFFEFB" stroke="#DDD8CE"/>
